name: Update Data

on:
  schedule:
    # Runs every night at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest CSVs from martj42/international_results
        run: |
          BASE_URL="https://raw.githubusercontent.com/martj42/international_results/master"
          for file in results.csv goalscorers.csv shootouts.csv; do
            echo "Fetching $file..."
            curl -fsSL "$BASE_URL/$file" -o "data/$file"
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.csv data/goalscorers.csv data/shootouts.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update international results data"
            git push origin main
          fi
